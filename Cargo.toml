[workspace]
resolver = "2"
members = [
    "kernel",
    "hal/hal-core",
    "hal/board-raspi3b",
    "userland/delta-abi",
    "userland/libdelta",
    "userland/init",
    "drivers/drv-uart",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
