[workspace]
resolver = "2"
members = [
    "kernel",
    "hal/hal-core",
    "hal/board-raspi3b",
    "hal/board-raspi02w",
    "userland/delta-abi",
    "userland/libdelta",
    "userland/init",
    "userland/shell",
    "drivers/drv-uart",
    "drivers/drv-sd",
    "drivers/drv-fb",
    "drivers/drv-audio",
    "drivers/drv-kbd",
    "fs",
    "userland/libdelta-ui",
    "apps/hello",
    "apps/dkex-diag",
    "apps/compositor",
    "apps/setup",
    "apps/launcher",
    "apps/terminal",
    "apps/hollow-star",
]

[workspace.package]
version = "0.6.0-rc.2"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
